[package]
name = "rewardcoherence"
version = "0.0.1"
edition = "2021"
license = "MIT"
description = "Audit reward-model coherence under OOD distributional shift from preference-pair data to agent-generated text."
repository = "https://github.com/Intermountainh8ter/rewardcoherence"
keywords = ["llm", "rlhf", "reward-model", "audit"]
categories = ["command-line-utilities", "science"]

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
rand = "0.8"
rand_pcg = "0.3"

[[bin]]
name = "rewardcoherence"
path = "src/main.rs"

[lib]
name = "rewardcoherence"
path = "src/lib.rs"
